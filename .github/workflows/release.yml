name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release zip
    runs-on: windows-latest
    if: github.repository == 'Harusame64/desktop-touch-mcp'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The release body used to be a fixed stub pointing at CHANGELOG.md, so every
      # "release notes" link landed on a page that said nothing about the release.
      # Lift this version's section out of CHANGELOG.md instead. A missing section
      # fails the job rather than publishing an empty release page.
      #
      # Runs before the long build steps on purpose: a malformed CHANGELOG heading
      # should fail in seconds, not after Rust, npm ci and the zip have been built.
      - name: Build release notes from CHANGELOG
        shell: pwsh
        run: |
          # node writes UTF-8, but PowerShell decodes a native command's stdout using
          # [Console]::OutputEncoding, which on a Windows runner comes from the console
          # code page. Without this the CHANGELOG's em-dashes reach the release page
          # as "â€”" (reproduced locally by forcing cp1252).
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $preamble = @(
            '## Install',
            '',
            '```bash',
            'npx -y @harusame64/desktop-touch-mcp',
            '```',
            '',
            '## Changes',
            ''
          )
          $section = node scripts/extract-changelog-section.mjs "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract the CHANGELOG section for $env:GITHUB_REF_NAME"
          }
          ($preamble + $section) | Set-Content -LiteralPath release-notes.md -Encoding UTF8
          Write-Host "release notes: $((Get-Content -LiteralPath release-notes.md).Count) lines"
      - name: Set up Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Fetch node.lib for MSVC linking
        shell: pwsh
        run: |
          # The custom build.rs links the addon against node.lib at the repo root.
          # GitHub-hosted runners don't ship node.lib, so fetch it via node-gyp
          # (which caches headers + import lib per Node version).
          $ver = (node -v).TrimStart('v')
          Write-Host "Installing node-gyp headers for Node $ver"
          npx --yes node-gyp install --target=$ver
          $cache = "$env:LOCALAPPDATA\node-gyp\Cache"
          $found = Get-ChildItem -Path $cache -Recurse -Filter node.lib -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\(x64|win-x64)\\node\.lib$' } |
                   Select-Object -First 1
          if (-not $found) {
            Get-ChildItem -Path $cache -Recurse -Filter node.lib -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  candidate: $($_.FullName)" }
            throw "node.lib not found in $cache"
          }
          Copy-Item -LiteralPath $found.FullName -Destination (Join-Path $PWD "node.lib")
          Write-Host "Copied node.lib from $($found.FullName)"

      - name: Build native addon (Rust → .node)
        run: npm run build:rs

      - name: Prepare release directory
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "release_build"
          $zipPath = Join-Path $PWD "desktop-touch-mcp-windows.zip"

          Remove-Item -LiteralPath $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $releaseDir | Out-Null

          Copy-Item -LiteralPath "package.json" -Destination $releaseDir
          Copy-Item -LiteralPath "package-lock.json" -Destination $releaseDir
          Copy-Item -LiteralPath "LICENSE" -Destination $releaseDir
          Copy-Item -LiteralPath "README.md" -Destination $releaseDir
          Copy-Item -LiteralPath "README.ja.md" -Destination $releaseDir
          Copy-Item -LiteralPath "dist" -Destination $releaseDir -Recurse

          # Native addon: ESM loader + type defs + compiled .node binary at root.
          # dist/engine/native-engine.js imports "../../index.js" → needs index.js
          # at the release root alongside the .node file.
          Copy-Item -LiteralPath "index.js" -Destination $releaseDir
          Copy-Item -LiteralPath "index.d.ts" -Destination $releaseDir
          Copy-Item -Path "desktop-touch-engine.*.node" -Destination $releaseDir

          if (Test-Path -LiteralPath "assets") {
            Copy-Item -LiteralPath "assets" -Destination $releaseDir -Recurse
          }

          if (Test-Path -LiteralPath "bin") {
            $binDir = Join-Path $releaseDir "bin"
            New-Item -ItemType Directory -Path $binDir -Force | Out-Null
            Copy-Item -Path "bin\*.exe" -Destination $binDir -ErrorAction SilentlyContinue
          }

          $pkgPath = Join-Path $releaseDir "package.json"
          $pkg = Get-Content -Raw -LiteralPath $pkgPath | ConvertFrom-Json
          $pkg.main = "dist/index.js"
          $runtimeDeps = [ordered]@{}
          foreach ($name in @(
            "@modelcontextprotocol/sdk",
            "@nut-tree-fork/nut-js",
            "sharp",
            "ws",
            "zod"
          )) {
            $runtimeDeps[$name] = $pkg.devDependencies.PSObject.Properties[$name].Value
          }
          $pkg | Add-Member -Force -NotePropertyName "dependencies" -NotePropertyValue $runtimeDeps
          if ($pkg.PSObject.Properties.Name -contains "bin") {
            $pkg.PSObject.Properties.Remove("bin")
          }
          if ($pkg.PSObject.Properties.Name -contains "files") {
            $pkg.PSObject.Properties.Remove("files")
          }
          if ($pkg.PSObject.Properties.Name -contains "scripts") {
            $pkg.PSObject.Properties.Remove("scripts")
          }
          $pkg | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $pkgPath -Encoding UTF8

      - name: Install production dependencies
        shell: pwsh
        run: |
          # Build a clean package.json with ONLY dependencies (no devDependencies)
          # in a completely isolated temp directory to avoid any npm parent-traversal
          # or cache interference from the workspace.
          $isolatedDir = Join-Path $env:TEMP "dtmcp-release-$(New-Guid)"
          New-Item -ItemType Directory -Path $isolatedDir | Out-Null

          # Read the release_build package.json (which has both dependencies and devDependencies)
          $releasePkg = Get-Content -Raw -LiteralPath "release_build\package.json" | ConvertFrom-Json

          # Create a minimal package.json with only the fields npm install needs
          $minimalPkg = [ordered]@{
            name         = $releasePkg.name
            version      = $releasePkg.version
            type         = "module"
            dependencies = [ordered]@{}
          }
          foreach ($prop in $releasePkg.dependencies.PSObject.Properties) {
            $minimalPkg.dependencies[$prop.Name] = $prop.Value
          }
          $minimalPkg | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$isolatedDir\package.json" -Encoding UTF8

          Write-Host "=== Isolated package.json ==="
          Get-Content "$isolatedDir\package.json"
          Write-Host "=== Installing in $isolatedDir ==="

          Push-Location $isolatedDir
          npm install --no-package-lock 2>&1 | Write-Host
          Pop-Location

          # Verify node_modules was actually created
          $nmPath = Join-Path $isolatedDir "node_modules"
          if (-not (Test-Path $nmPath)) {
            throw "FATAL: npm install produced no node_modules in $isolatedDir"
          }
          $count = (Get-ChildItem -Path $nmPath -Directory | Measure-Object).Count
          Write-Host "=== Installed $count top-level packages ==="
          if ($count -lt 5) {
            Get-ChildItem -Path $nmPath -Directory | ForEach-Object { Write-Host "  $_" }
            throw "FATAL: Expected 5+ top-level packages, got $count"
          }

          # Move the node_modules into release_build
          Move-Item -LiteralPath $nmPath -Destination "release_build\node_modules"

      - name: Prune release package metadata
        shell: pwsh
        run: |
          $pkgPath = Join-Path $PWD "release_build\package.json"
          $pkg = Get-Content -Raw -LiteralPath $pkgPath | ConvertFrom-Json
          if ($pkg.PSObject.Properties.Name -contains "devDependencies") {
            $pkg.PSObject.Properties.Remove("devDependencies")
          }
          $pkg | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $pkgPath -Encoding UTF8

      - name: Create zip
        shell: pwsh
        run: |
          # Compress-Archive silently drops files in deeply nested node_modules (e.g. @modelcontextprotocol/sdk).
          # Use 7-Zip which is pre-installed on windows-latest runners.
          Push-Location release_build
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "..\desktop-touch-mcp-windows.zip" "." -r
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }


      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-touch-mcp-windows.zip
          fail_on_unmatched_files: true
          body_path: release-notes.md

  # Mac port (M3-2a): the macOS (Apple Silicon) zip, added to the release the Windows job created.
  # After windows-release, so the two never race to create the release. Since M3-2b npm-publish
  # waits for it: the launcher carries a SHA256 for both zips.
  # Contents mirror the Windows zip; scripts/build-release-macos.mjs assembles and checks them.
  macos-release:
    name: Build macOS release zip
    runs-on: macos-15
    needs: windows-release
    # The smoke drives AX; a call that blocks must not leave the Release run open for 6 h.
    timeout-minutes: 30
    if: github.repository == 'Harusame64/desktop-touch-mcp'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build native addon (darwin-arm64, release, no vision-gpu)
        run: npm run build:rs -- --no-default-features

      - name: Assemble and check the macOS zip
        run: node scripts/build-release-macos.mjs

      - name: Smoke the zip's own contents
        run: |
          set -e
          X="$RUNNER_TEMP/dtmcp-macos-zip"
          rm -rf "$X" && mkdir -p "$X"
          unzip -q desktop-touch-mcp-macos-arm64.zip -d "$X"
          cp scripts/smoke-macos.mjs "$X/smoke.mjs"
          # --help: capture first, then check the text — `--help | head -1` takes head's exit status
          # and checks nothing (gate 2, #784). sharp: actually encode, from the zip's node_modules.
          cd "$X"
          V=$(node -p 'require("./package.json").version')
          out=$(node dist/index.js --help)
          printf '%s\n' "$out" | head -1
          grep -qF "desktop-touch-mcp v$V (macOS preview)" <<<"$out" || { echo "::error::--help did not print v$V (macOS preview)"; exit 1; }
          node -e 'import("sharp").then((s) => s.default({ create: { width: 2, height: 2, channels: 4, background: "#000" } }).png().toBuffer()).then((b) => console.log("sharp ok", b.length), (e) => { console.error(e); process.exit(1); })'
          node smoke.mjs

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-touch-mcp-macos-arm64.zip
          fail_on_unmatched_files: true

  npm-publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    # Both zips: the launcher ships a SHA256 for each, so it cannot publish before the macOS zip exists.
    needs: [windows-release, macos-release]
    if: github.repository == 'Harusame64/desktop-touch-mcp'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Install dev deps so the `prepare: tsc` lifecycle that `npm publish`
      # triggers can resolve @types/node, zod, and the MCP SDK.
      # `--ignore-scripts` was supposed to skip prepare entirely, but in
      # npm 11+ the publish flow still runs it for tarball staging. Cheaper
      # to install deps than to refactor the lifecycle.
      - name: Install dependencies
        run: npm ci

      - name: Get and validate version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not in vX.Y.Z format"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Mac port (M3-2b): one SHA256 per release zip — the launcher picks the zip for its platform
      # and verifies it against its own entry. Each zip must hold dist/index.js; the macOS zip must
      # also hold the darwin addon.
      - name: Download release zips, verify contents, set each SHA256 in launcher.js
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          for ASSET in desktop-touch-mcp-windows.zip desktop-touch-mcp-macos-arm64.zip; do
            ZIP_URL="https://github.com/Harusame64/desktop-touch-mcp/releases/download/v${VERSION}/${ASSET}"
            rm -f release.zip
            for i in $(seq 1 30); do
              if curl -fL -o release.zip "$ZIP_URL"; then
                break
              fi
              echo "${ASSET} not yet available, retry $i/30 (sleeping 10s)"
              sleep 10
            done
            if [ ! -f release.zip ]; then
              echo "::error::Failed to download ${ASSET} after 30 retries"
              exit 1
            fi
            # The listing goes to a variable first: with pipefail, `unzip -l | grep -q` fails when grep
            # exits early and unzip takes SIGPIPE — measured on the 33 MB macOS zip (simulated run).
            LISTING=$(unzip -l release.zip)
            grep -qE '[[:space:]]dist/index\.js$' <<<"$LISTING" || {
              echo "::error::dist/index.js missing from ${ASSET}"
              exit 1
            }
            if [ "$ASSET" = "desktop-touch-mcp-macos-arm64.zip" ]; then
              grep -qE '[[:space:]]desktop-touch-engine\.darwin-arm64\.node$' <<<"$LISTING" || {
                echo "::error::the darwin addon is missing from ${ASSET}"
                exit 1
              }
            fi
            SHA256=$(sha256sum release.zip | cut -d' ' -f1)
            node scripts/update-sha.mjs "$ASSET" "$SHA256"
            rm release.zip
          done

      - name: Verify manifest
        run: npm run check:launcher-manifest

      # v1.0.3 fix: setup-node@v4 ships npm 10.9.7 (Node 22), but OIDC
      # automatic token exchange for Trusted Publishing requires npm 11.5.1+.
      # `npm install -g npm@latest` clobbers the runner's bundled npm
      # mid-self-upgrade and dies with `Cannot find module 'promise-retry'`,
      # so use npx — it stages npm 11 in a temp dir and avoids the
      # self-overwrite race.
      # v1.12.1 fix: pin the major to npm@11 instead of npm@latest — the day
      # npm 12.0.0 hit the `latest` dist-tag it shipped without its `sigstore`
      # dependency, so `publish --provenance` died with MODULE_NOT_FOUND and
      # the v1.12.1 job failed twice (published manually). A floating `latest`
      # makes every future npm major a release-day gamble; bump this pin
      # deliberately, and verify on the bumped major's first real release (a
      # --dry-run does not exercise the sigstore/provenance path that broke here).
      - name: Publish to npm (via npx npm@11 for OIDC support)
        run: npx -y npm@11 publish --ignore-scripts --provenance

      - name: Verify npm publish
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          for i in $(seq 1 12); do
            PUBLISHED=$(npm view "@harusame64/desktop-touch-mcp" dist-tags.latest 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "npm publish verified: $PUBLISHED"
              exit 0
            fi
            echo "Waiting for npm registry propagation ($i/12, got: $PUBLISHED)"
            sleep 10
          done
          echo "::error::Expected $VERSION on npm, got $PUBLISHED"
          exit 1
