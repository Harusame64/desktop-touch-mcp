name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'README.md'
      - 'README.ja.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'README.md'
      - 'README.ja.md'
      - '.github/workflows/pages.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check generated Linux stub catalog
        run: npm run check:stub-catalog

      - name: Check failWith callsite-shape fixtures (ADR-021 PR-P2-2 — codemod shape gate)
        # Regenerates the failWith callsite-shape catalogue and fails if it drifts
        # from source. Pairs with the frozen-golden bit-equality test
        # (tests/unit/path-class-contract/failwith-thin-wrapper.test.ts): a
        # callsite added/removed/reshaped without regenerating fails here, and a
        # novel context shape fails the test's Layer B coverage assertion.
        run: npm run check:failwith-fixtures

      - name: Check napi panic safety (ADR-007 §3.4 — sync #[napi] must use napi_safe_call)
        run: npm run check:napi-safe

      - name: Check native types (Rust #[napi] vs index.d.ts drift)
        run: npm run check:native-types

      - name: Check no koffi (ADR-007 §6 P4 acceptance — zero koffi.X call sites)
        run: npm run check:no-koffi

      - name: Type check the root config files (#656 — a removed option must stop compiling)
        # `tsconfig.json` covers `src/**/*` only, so `vitest.config.ts` is outside the
        # program and ESLint is not type-aware: a config key that stops existing keeps
        # parsing and stops doing anything. That is how `poolOptions` (removed in Vitest 4)
        # and a per-project `teardownTimeout` (root-only) sat decorative in that file for
        # months (#655). This step compiles it against the installed runner types.
        run: npm run check:config-types

      - name: Check Rust workspace compiles (covers non-napi member crates)
        # `npm run build:rs:debug` only builds the root crate via napi-rs, so
        # workspace members like `engine-perception` (ADR-008 D1+) are not
        # exercised by the napi step alone. This explicit `cargo check
        # --workspace` ensures every workspace member compiles in CI.
        run: npm run check:rs-workspace

      - name: Fetch node.lib for MSVC linking
        shell: pwsh
        run: |
          # The custom build.rs links the native addon against node.lib at the
          # repo root. GitHub-hosted runners don't ship node.lib, so fetch it
          # via node-gyp (which caches headers + import lib per Node version).
          $ver = (node -v).TrimStart('v')
          Write-Host "Installing node-gyp headers for Node $ver"
          npx --yes node-gyp install --target=$ver
          $cache = "$env:LOCALAPPDATA\node-gyp\Cache"
          $found = Get-ChildItem -Path $cache -Recurse -Filter node.lib -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\(x64|win-x64)\\node\.lib$' } |
                   Select-Object -First 1
          if (-not $found) { throw "node.lib not found in $cache" }
          Copy-Item -LiteralPath $found.FullName -Destination (Join-Path $PWD "node.lib")

      - name: Check Rust test targets compile (guards dep-API drift in #[cfg(test)] code)
        # `check:rs-workspace` only compiles non-test code, so test-only code —
        # e.g. the vision-gpu tokenizer tests under #[cfg(all(test, feature =
        # "vision-gpu"))] — can silently rot against upstream crate API changes
        # (tokenizers 0.21 moved `WordLevelBuilder::vocab` to AHashMap and made
        # `with_post_processor` take Option<_>). This `--no-run` step compiles
        # every test binary so that drift fails CI. We intentionally do NOT run
        # the tests here: the runtime unit suite is non-hermetic on the 2-core
        # windows runners (DXGI screen-capture / focus tests flake without a
        # live desktop), so a compile guard is the robust CI contract. Placed
        # after the node.lib fetch because the napi test binary links node.lib.
        run: npm run check:rs-test-compile

      - name: Rust window tests (hermetic subset of the compile-guarded suite)
        # The step above deliberately does not RUN the Rust tests, because the
        # DXGI / focus ones are non-hermetic on these runners. `win32::window`
        # is not in that class: it creates its own off-screen windows and
        # touches no capture pipeline or foreground state. It covers the wheel
        # leaf resolution contracts (hit-test descent, tree containment,
        # SCROLL_LEAF_CHAINS refusal), which otherwise have no CI protection at
        # all. Each test skips itself if the runner has no window station, so a
        # restricted environment degrades to a no-op rather than a red build.
        run: cargo test -p desktop-touch-engine --lib win32::window

      - name: Build native addon (Rust → .node, debug profile for CI speed)
        run: npm run build:rs:debug

      - name: Type check & build
        run: npm run build

      - name: Envelope size SLO bench (ADR-010 P1 §5.6.1)
        # Pure pure-JS bench (no napi) measuring `desktop_state` envelope
        # serialised payload size for 5 representative scenarios. Exits 1
        # when any scenario exceeds ENVELOPE_MINIMAL_SIZE_THRESHOLD_BYTES
        # (1024 bytes), which would silently force `confidence: degraded`
        # at runtime. CI fails on SLO regression so the threshold is held
        # bit-equal with `src/tools/_envelope.ts` and ADR-010 §5.6.1.
        run: npm run bench:envelope-size

      # NOTE: full unit suite execution on windows-latest 2-core runners is
      # currently unreliable (every attempt — "default maxForks:4", single
      # fork via --maxWorkers=1, threads pool, vmThreads pool — terminates
      # with "##[error]The operation was canceled." 5-6s into the run, after
      # the first 2 files complete but before the 3rd worker finishes
      # spawning). Likely a runner-infra interaction with how vitest spawns
      # forks on a small Windows VM. Investigated in PR #45; deferred.
      #
      # CORRECTION 2026-09-15, and it is narrower than the first attempt at it:
      # ONE ARM OF THIS RECORD DID NOT TEST WHAT IT SAYS. `poolOptions` was
      # removed in Vitest 4 and is read only to print a deprecation, so "default
      # maxForks:4" ran at whatever the CPU default was, not at 4. The
      # `--maxWorkers=1` arm WAS honoured — the config of that day set no
      # project-level `maxWorkers`, so the flag reached the root
      # (`git show 4b1a5155:vitest.config.ts`). Project-level shadowing of
      # `--maxWorkers` is a VITEST 4 behaviour; vitest 5 lets the flag through at
      # project level too, so do not carry that rule forward past #658.
      #
      # WHAT THAT DEFAULT WAS IS NOT RECORDED ANYWHERE WE CAN CHECK, and this
      # note's own two halves disagree: the deleted step said "windows-latest is
      # a 2-core runner" AND "4 forks load the native addon concurrently", which
      # cannot both be true once maxForks is known to be inert (a 2-core default
      # is one worker). GitHub has also changed standard runner sizes since.
      # So: do not reason from a CPU count here. Print
      # `node -p "require('os').availableParallelism()"` in the job before
      # concluding anything about this, including how the cap added in the same
      # commit as this note resolves there.
      #
      # P0-1 (audit §8.1) is therefore PARTIALLY addressed:
      #   - Rust build:rs runs here → catches Rust regressions (was the
      #     bigger concern: tooling drift, FFI shape, build.rs node.lib).
      #   - TypeScript test execution is left to local pre-merge run via
      #     `npm run test:capture`. Audit doc and known-issues track this.
      #
      # IMPORTANT for local runs: rebuild the Rust addon (`npm run build:rs:debug`)
      # before `npm run test:capture` if any src/*.rs or Cargo.toml changed since
      # last build. A stale .node binary causes preprocess / vision_backend tests
      # to fail with confusing errors. See docs/release-process.md
      # "Local Pre-Merge Testing".

  # THE WIRE-SCHEMA PINS GET THEIR OWN JOB, and the reason is the placement, not the runner.
  # These two files assert what the SDK's converter emits for the widened properties that ship,
  # and a pin nobody executes is the mechanism that already failed (#657 sat red on `main` for
  # eight days with nothing running it).
  #
  # THEY DID RUN ON THE WINDOWS JOB, once: a step this PR then REMOVED (2026-09-15, run
  # 34962210359 step 14, green — not reproducible from this file, because the step is gone).
  # They are not there anyway: vitest's documented failure mode on those 2-core runners is
  # "##[error]The operation was canceled." 5-6s in, which kills the JOB — so a runner flake would
  # take `check:rs-*`, the addon build, `npm run build` (the `tsc` over `src/`) and the
  # envelope bench down with it. And the note's "the first two files complete" were whatever two
  # files ran first, not these two, which are among the heaviest to LOAD in the suite
  # (`keyboard.ts` and `terminal.ts` each pull tens of engine modules; the 788 ms measured locally
  # is a warm-cache 8-core mac, against a 5-6 s window on a cold 2-core VM). Gate 2 made that
  # argument and it is right: the cheap fix is to stop coupling the two (gate 2 round 3, 2026-09-15).
  #
  # AND THE CONSEQUENCE, SAID HERE RATHER THAN LEFT TO BE GENERALISED FROM THE JOB NAME: the unit
  # cells now never run on Windows in CI, in a Windows product. FOR THESE TWO FILES THAT IS
  # CORRECT — what they check is the shape of a JSON document, which has no platform. IT DOES NOT
  # GENERALISE TO ANY OTHER CELL. Adding units to the Windows job takes the gates already there
  # hostage: a cancelled runner kills the job, not the step.
  #
  # ubuntu-latest is legitimate here because both files are import-hermetic and
  # platform-independent: no native addon (the addon is a lazy `await import` inside a function),
  # no Windows-only behaviour, no Rust. What they check is the SHAPE of a JSON document.
  wire-schema-pins:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `--ignore-scripts` because bare `npm ci` fires `prepare`, which is
        # `install-hooks && tsc` — so this job's real first gate would be a full compile of
        # `src/` on Linux, a combination nothing else here exercises, failing at a step called
        # "Install dependencies" with no mention of wire pins. The Dockerfile avoids it the same
        # way (gate 2 round 4). This job needs `node_modules`, not a build.
        run: npm ci --ignore-scripts

      - name: Wire-schema pins (#657/#662 — what the SDK's converter emits for every flattened tool)
        run: npm run check:wire-pins

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Glama inspection image
        run: docker build -t desktop-touch-mcp-glama .
