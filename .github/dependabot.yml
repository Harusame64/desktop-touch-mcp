version: 2
updates:
  # internal #348: what the release zips ship (release/package-lock.json). These packages are
  # devDependencies at the root (the npm package is only the launcher), where Dependabot scores
  # them "development"; here they are production. A bump here must be matched at the root, and
  # tests/unit/release-lock-matches-the-root.test.ts goes red until it is.
  - package-ecosystem: "npm"
    directory: "/release"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (8.63.0, latest) still declares peer typescript ">=4.8.4 <6.1.0".
      # A TypeScript major bump therefore breaks `npm ci` with ERESOLVE (see PR #530).
      # Drop this once typescript-eslint ships a release that accepts TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
